name: Android

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Typecheck, lint and logic checks
        run: |
          npm run typecheck
          npm run lint
          npm run check
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the emulator APK (x86_64)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/engram-x86_64.apk
      - name: Build the phone APK (arm64)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../out/engram.apk
          ls -lh ../out
      - uses: actions/upload-artifact@v4
        with:
          name: engram-apk
          path: out/*.apk
          if-no-files-found: error

  smoke:
    name: Launch on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engram-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/smoke.sh out/engram-x86_64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke
          if-no-files-found: warn
      - name: Publish screenshots to the smoke-shots branch
        if: always() && github.ref == 'refs/heads/main'
        run: |
          cd smoke
          git init -q -b smoke-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tail -c 400000 logcat.txt > logcat-tail.txt 2>/dev/null || true
          rm -f logcat.txt
          git add -A
          git commit -q -m "Smoke test screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-shots

  release:
    name: Publish GitHub release
    # Runs for a pushed tag (v1.2.3) or a pushed branch named release/v1.2.3.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engram-apk
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#release/}"
          mv out/engram.apk "out/engram-$TAG.apk"
          gh release create "$TAG" "out/engram-$TAG.apk" --target "$GITHUB_SHA" --title "Engram $TAG" --notes-file docs/release-notes.md
