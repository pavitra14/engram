name: Android

# Speed notes (see docs/CI.md):
#  - Changes that only touch documents do not start a run.
#  - A push to main builds one APK (x86_64, for the emulator test). The phone APK
#    (arm64) is built only for a release, or when a run is started by hand.
#  - Set the repository variable ENGRAM_RUNNER to the label of your own runner
#    (for example "self-hosted") and the build job runs there, keeping its
#    Gradle and C++ caches between runs. Pull requests always use GitHub's runners.
on:
  push:
    branches: [main, 'release/**', 'redesign-**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

env:
  # More memory and parallel workers for Gradle; reuse task outputs between runs.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Check and build APK
    runs-on: ${{ (github.event_name != 'pull_request' && vars.ENGRAM_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch' }}
      # Engram Cloud's public address and publishable key, baked into the app at build time.
      # Without them the app builds and works, with no cloud option. Never put a secret key here.
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On your own runner, keep node_modules and the previous build so the next one is incremental.
          clean: ${{ !vars.ENGRAM_RUNNER || github.event_name == 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Release branches read and write the cache too, not only main.
          cache-read-only: false
      - run: npm ci
      - name: Typecheck, lint and logic checks
        run: |
          npm run typecheck
          npm run lint
          npm run check
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build the emulator APK (x86_64)
        working-directory: android
        run: |
          # One retry: the runner's download of the Android NDK sometimes arrives corrupt.
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64 \
            || { echo "The build failed; trying once more."; ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=x86_64; }
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/engram-x86_64.apk
      - name: Build the phone APK (arm64)
        if: env.RELEASING == 'true'
        working-directory: android
        run: |
          # One retry: the runner's download of the Android NDK sometimes arrives corrupt.
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a \
            || { echo "The build failed; trying once more."; ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a; }
          cp app/build/outputs/apk/release/app-release.apk ../out/engram.apk
          ls -lh ../out
      - uses: actions/upload-artifact@v4
        with:
          name: engram-apk
          path: out/*.apk
          if-no-files-found: error

  smoke:
    name: Launch on an emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engram-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/smoke.sh out/engram-x86_64.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke
          if-no-files-found: warn
      - name: Publish screenshots to the smoke-shots branch
        if: always() && github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
          PKG_NAME: dev.pavitra.engram
        run: |
          # main publishes to smoke-shots; any other branch to smoke-shots-<branch>
          TARGET=smoke-shots
          if [ "$REF_NAME" != "main" ]; then TARGET="smoke-shots-$(echo "$REF_NAME" | tr '/' '-')"; fi
          cd smoke
          git init -q -b "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          grep -E "ReactNativeJS|AndroidRuntime|$PKG_NAME|uimode" logcat.txt | tail -c 300000 > logcat-tail.txt 2>/dev/null || true
          rm -f logcat.txt
          git add -A
          git commit -q -m "Smoke test screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$TARGET"

  release:
    name: Publish GitHub release
    # Runs for a pushed tag (v1.2.3) or a pushed branch named release/v1.2.3.
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engram-apk
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${REF_NAME#release/}"
          mv out/engram.apk "out/engram-$TAG.apk"
          # Betas are ordinary releases from 0.7 on. Only alpha and rc builds are marked as pre-releases.
          PRE=""; case "$TAG" in *-alpha*|*-rc*) PRE="--prerelease";; esac
          gh release create "$TAG" "out/engram-$TAG.apk" $PRE --target "$GITHUB_SHA" --title "Engram $TAG" --notes-file docs/release-notes.md
